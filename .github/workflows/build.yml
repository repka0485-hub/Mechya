name: build
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ABI: arm64-v8a
      API: "24"
    steps:
      - uses: actions/checkout@v4

      - name: deps (imgui + And64InlineHook)
        run: |
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git imgui
          curl -fsSL -o And64InlineHook.cpp https://raw.githubusercontent.com/Rprop/And64InlineHook/master/And64InlineHook.cpp
          curl -fsSL -o And64InlineHook.hpp https://raw.githubusercontent.com/Rprop/And64InlineHook/master/And64InlineHook.hpp

      - name: build esp
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-$API \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMGUI_DIR=$PWD/imgui
          cmake --build build -j$(nproc)
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build/libesp.so

      - uses: actions/upload-artifact@v4
        with:
          name: libesp-${{ env.ABI }}
          path: build/libesp.so
